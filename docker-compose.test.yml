services:
  postgres-test:
    image: postgres:16-alpine
    container_name: questora-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: questora_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d questora_test"]
      interval: 5s
      timeout: 5s
      retries: 10
